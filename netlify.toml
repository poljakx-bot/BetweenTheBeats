[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/physics/book-one"
  to = "/physics/book-one/"
  status = 301
[[redirects]]
  from = "/physics/book-two"
  to = "/physics/book-two/"
  status = 301
[[redirects]]
  from = "/physics/book-three"
  to = "/physics/book-three/"
  status = 301



